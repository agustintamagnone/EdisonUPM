spring.application.name=edison-backend
server.port=${SERVER_PORT:8080}

# ---------- MySQL ----------
# Override with environment variables or with application-local.properties (git-ignored).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edison_upm?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:edison}
spring.datasource.password=${DB_PASSWORD:Edison_Upm2026}

# The schema is owned by database/schema.sql; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Image Storage ----------
edison.storage.images-dir=${IMAGES_DIR:./storage/images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- CORS (frontend origin) ----------
edison.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

spring.config.import=optional:classpath:application-local.properties
